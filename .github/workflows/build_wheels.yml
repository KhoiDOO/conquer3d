name: Build Prebuilt CUDA Wheels
run-name: "Build Wheels for target tag: ${{ github.event.inputs.release_tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (e.g. v0.6.0) to attach wheels'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheel (Python ${{ matrix.python-version }}, PyTorch ${{ matrix.cuda-pair.torch-version }}, CUDA ${{ matrix.cuda-pair.cuda-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        cuda-pair:
          - { cuda-version: "12.8.2", torch-version: "2.8.0", cuda-whl-tag: "cu128" }
          - { cuda-version: "12.8.2", torch-version: "2.11.0", cuda-whl-tag: "cu128" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install System Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda-pair.cuda-version }}

      - name: Install PyTorch & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja
          pip install torch==${{ matrix.cuda-pair.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.cuda-pair.cuda-whl-tag }} || pip install torch==${{ matrix.cuda-pair.torch-version }} --extra-index-url https://download.pytorch.org/whl/${{ matrix.cuda-pair.cuda-whl-tag }} || pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/${{ matrix.cuda-pair.cuda-whl-tag }}

      - name: Build CUDA Wheel
        env:
          FORCE_CUDA: 1
          MAX_JOBS: 4
          TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0+PTX"
        run: |
          python setup.py bdist_wheel --dist-dir dist
          TORCH_TAG=$(echo "${{ matrix.cuda-pair.torch-version }}" | tr -d '.')
          for f in dist/*.whl; do
            if [[ "$f" != *"+pt"* ]]; then
              new_f=$(echo "$f" | sed "s/-cp/+pt${TORCH_TAG}${{ matrix.cuda-pair.cuda-whl-tag }}-cp/")
              mv "$f" "$new_f"
            fi
          done

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conquer3d-whl-py${{ matrix.python-version }}-pt${{ matrix.cuda-pair.torch-version }}-${{ matrix.cuda-pair.cuda-whl-tag }}
          path: dist/*.whl

      - name: Attach Wheels to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.whl
