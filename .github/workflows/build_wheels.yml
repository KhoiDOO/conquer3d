name: Build Prebuilt CUDA Wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (e.g. v0.6.0) to attach wheels'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheel (Python ${{ matrix.python-version }}, CUDA ${{ matrix.cuda-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        cuda-version: ["12.4"]
        include:
          - cuda-version: "12.4"
            torch-version: "2.5.1"
            cuda-whl-tag: "cu124"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Graphics Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.4.0'

      - name: Install PyTorch & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel ninja
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.cuda-whl-tag }}

      - name: Build CUDA Wheel
        env:
          FORCE_CUDA: 1
          MAX_JOBS: 4
          TORCH_CUDA_ARCH_LIST: "7.0 7.5 8.0 8.6 8.9 9.0+PTX"
        run: |
          python setup.py bdist_wheel --dist-dir dist

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conquer3d-whl-py${{ matrix.python-version }}-${{ matrix.cuda-whl-tag }}
          path: dist/*.whl

      - name: Attach Wheels to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.whl
