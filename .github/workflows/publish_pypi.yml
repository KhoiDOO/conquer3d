name: Publish Wheels to PyPI
run-name: "Publish PyPI Wheels for target tag: ${{ github.event.inputs.release_tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (e.g. v0.6.7) to download and publish wheels'
        required: true
        default: 'v0.6.7'

permissions:
  id-token: write
  contents: read

jobs:
  publish_pypi:
    name: Publish Wheels to PyPI (OIDC Trusted Publisher)
    runs-on: ubuntu-latest
    steps:
      - name: Download Prebuilt Wheels from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          echo "Downloading prebuilt .whl assets from GitHub Release tag: $TAG"
          gh release download "$TAG" --dir dist --pattern "*.whl"
          ls -la dist/

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
