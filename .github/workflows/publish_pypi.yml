name: Publish Wheels to PyPI
run-name: "Publish PyPI Wheels for target tag: ${{ github.event.inputs.release_tag || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (e.g. v0.6.7) to download and publish wheels'
        required: false
        default: ''
  workflow_run:
    workflows: ["Build Prebuilt CUDA Wheels"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  publish_pypi:
    name: Publish Wheels to PyPI (OIDC Trusted Publisher)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Download Wheel Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: conquer3d-whl-*
          path: dist/
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || github.run_id }}

      - name: Verify Wheel Files
        run: |
          mkdir -p dist
          ls -la dist/

      - name: Publish Package Distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
