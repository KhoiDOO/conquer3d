version: '3.8'

services:
  base:
    image: conquer3d:latest
    container_name: conquer3d_base
    volumes:
      # Map the experiments folder so the scripts can read and write output locally
      - ./experiments:/workspace/experiments
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # The Dockerfile ENTRYPOINT handles the conda environment activation automatically
    command: ["/bin/bash", "experiments/marching_tetrahedra/base.sh"]

  fairness:
    image: conquer3d:latest
